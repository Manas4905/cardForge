<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CardForge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>CardForge</h1>
      </header>

      <main class="app-layout">
        <section class="controls-panel">
          <div class="controls">
            <div class="field">
              <label for="nameInput">Card Name</label>
              <input
                id="nameInput"
                type="text"
                placeholder="Enter your name"
                maxlength="24"
              />
            </div>

            <div class="field">
              <label for="fontSelect">Font Style</label>
              <select id="fontSelect">
                <option value="sans-serif">Modern Sans</option>
                <option value="serif">Classic Serif</option>
                <option value="monospace">Tech Mono</option>
                <option value='"Trebuchet MS", sans-serif'>
                  Rounded Clean
                </option>
              </select>
            </div>

            <div class="field">
              <label for="fontColorInput">Font Color</label>
              <input id="fontColorInput" type="color" value="#000000" />
            </div>

            <div class="field">
              <label for="bgColorInput">Card Background</label>
              <input id="bgColorInput" type="color" value="#d11f00" />
            </div>

            <div class="position-controls">
              <div class="pos-header">
                <span class="pos-label">Name Position</span>
                <button class="reset-btn" id="resetPos" type="button">
                  Reset
                </button>
              </div>
              <div class="slider-row">
                <label for="sliderX">Horizontal</label>
                <input type="range" id="sliderX" min="0" max="100" value="0" />
                <span class="slider-val" id="valX">0</span>
              </div>
              <div class="slider-row">
                <label for="sliderY">Vertical</label>
                <input
                  type="range"
                  id="sliderY"
                  min="0"
                  max="100"
                  value="100"
                />
                <span class="slider-val" id="valY">100</span>
              </div>
            </div>
          </div>
        </section>

        <section class="preview-panel">
          <div class="card-wrap">
            <svg
              id="card"
              viewBox="0 0 420 260"
              role="img"
              aria-label="Card preview"
            ></svg>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
